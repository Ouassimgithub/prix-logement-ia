<path d="M190 500 Q600 600 850 350" stroke="#2c3e50" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#b)"/>
<text x="740" y="470" fill="#2c3e50" font-weight="bold">A · docker push 1.1.0</text>
<path d="M760 290 L690 290" stroke="#2c3e50" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
